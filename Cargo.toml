# The placer that hands the skills to their consumers, and the repository's checks, as one package at the
# root. The skills are files; the package reads them and places them, and its tests in `tests/` hold them
# to `docs/format.md`.
[package]
name = "bmo-skills"
description = "The skill bundle, one folder per skill, and the placer that writes a bundle or a skill into a consumer's tree."
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bmo-skills"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
# The front matter block of a `SKILL.md`, its delimiters and its YAML, is read by the front matter library
# with its default YAML engine; the manifest and the `--json` answer are JSON.
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# Each placement is built in a temporary directory beside its target and swapped in.
tempfile = "3.20.0"

[dev-dependencies]
# The checks find the paths, skill names and personal values' shapes in the skills' prose by pattern.
regex = "1.11.1"
